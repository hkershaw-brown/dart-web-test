<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="font-awesome.css">
  <style>
    .icon-grid { display: flex; flex-wrap: wrap; }
    .icon-item { width: 120px; padding: 10px; text-align: center; font-size: 24px; }
    .icon-label { font-size: 12px; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Font Awesome 4.7 Icon Preview</h1>
  <div class="icon-grid">
    <!-- Paste the icon list here -->
    <div class="icon-item"><i class="fa fa-github"></i><div class="icon-label">fa-github</div></div>
    <div class="icon-item"><i class="fa fa-twitter"></i><div class="icon-label">fa-twitter</div></div>
    <div class="icon-item"><i class="fa fa-facebook"></i><div class="icon-label">fa-facebook</div></div>
    <div class="icon-item"><i class="fa fa-linkedin"></i><div class="icon-label">fa-linkedin</div></div>
    <!-- ...add more icons as needed... -->
  </div>
</body>
</html>
